    <!-- ==================================================
         SCRIPT DEL SLIDER
    ================================================== -->

    <script>

        let indiceActual = 0;

        const videos = document.querySelectorAll(".video-item");


        function cambiarSlide(direccion) {

            videos[indiceActual].classList.remove("activo");


            indiceActual += direccion;


            if (indiceActual >= videos.length) {

                indiceActual = 0;

            }


            if (indiceActual < 0) {

                indiceActual = videos.length - 1;

            }


            videos[indiceActual].classList.add("activo");

        }

    </script>
